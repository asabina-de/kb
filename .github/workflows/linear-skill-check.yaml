name: Linear skill check

on:
  pull_request:
    # opened: PR first created. synchronize: new commits pushed to PR branch.
    # reopened/edited: see below.
    # No paths filter — this workflow must always run because a ruleset on main
    # requires the "Check Linear skill deployment plan" status. If the workflow
    # doesn't trigger, the status is never reported and the PR can't merge.
    # The internal skills-diff step short-circuits when skills/ is unchanged.
    #
    # `edited` is here because a PR's BASE BRANCH change fires `edited`, not
    # `synchronize` — and changing the base changes the diff this workflow
    # inspects. Without it, retargeting a stacked PR after its parent merges
    # leaves the required status permanently unreported: no job ever runs for
    # that head SHA, so there is nothing to re-run and the PR cannot merge
    # (observed on #85, KB-121). The comment above warned about exactly this
    # failure while the trigger list still allowed it.
    #
    # `reopened` for the same reason: close/reopen fires neither of the other
    # two, and a reopened PR needs its required status back.
    types: [opened, synchronize, reopened, edited]

permissions:
  pull-requests: read
  contents: read

jobs:
  check-skills:
    name: Check Linear skill deployment plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if skills/ changed
        id: skills-diff
        run: |
          if git diff --quiet "$GITHUB_BASE_SHA" HEAD -- skills/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes in skills/ — skipping Linear check"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}

      - uses: actions/setup-node@v4
        if: steps.skills-diff.outputs.changed == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .github/scripts/package-lock.json

      - name: Install deps
        if: steps.skills-diff.outputs.changed == 'true'
        working-directory: .github/scripts
        run: npm ci

      # Run from the repo root so the script sees skills/ at cwd. Node resolves
      # @linear/sdk from .github/scripts/node_modules via the script's own path.
      - name: Plan skill deployment
        if: steps.skills-diff.outputs.changed == 'true'
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          LINEAR_SKILL_TEAMS: ${{ vars.LINEAR_SKILL_TEAMS }}
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node .github/scripts/linear-skills.mjs check
