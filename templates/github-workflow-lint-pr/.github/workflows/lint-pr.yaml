name: Lint PR

# Why `pull_request` (not `pull_request_target`):
#
# The two triggers differ in which branch supplies the workflow file:
#
#   pull_request        → runs the workflow from the PR's HEAD branch
#   pull_request_target → runs the workflow from the BASE branch (e.g. main)
#
# `pull_request_target` exists to protect repos that accept PRs from
# forks. A forked PR using `pull_request` can modify the workflow to
# exfiltrate repo secrets. `pull_request_target` prevents this by
# ignoring the PR branch's workflow entirely — it always runs the base
# branch copy. But this comes at a cost:
#
#   1. A workflow introduced in a PR won't run on that PR (the base
#      branch doesn't have the file yet).
#   2. Changes to an existing workflow are invisible on PRs — the base
#      branch version runs, not yours. There is no partial pick-up.
#   3. The only way to test workflow changes is to temporarily switch to
#      `pull_request`, push, verify, then revert before merging.
#
# This repo is private with no fork contributions. The security benefit
# of `pull_request_target` does not apply, and the testing friction is
# pure cost. We use `pull_request` so workflow changes are testable on
# the PRs that introduce them.
#
# If this repo ever accepts fork contributions, migrate to
# `pull_request_target`:
#   - Change `pull_request` → `pull_request_target` below
#   - Accept that workflow changes require the test-revert dance above
#   - Review GITHUB_TOKEN permissions (base branch context, not PR)

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize

permissions:
  pull-requests: read

jobs:
  validate-pr-title:
    name: Validate PR title
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Type and scope only. The ticket-ID rule deliberately does NOT live
      # here as a `subjectPattern` (KB-121).
      #
      # It used to, and the escape hatch rode along in the same option as a
      # GitHub expression that chose between '^.+$' and the strict pattern
      # depending on whether the body carried [noticket]. No test could reach
      # that expression: the fixture proved the regex rejected bad subjects,
      # but nothing proved the hatch still let a ticketless PR through. An
      # escape hatch never seen escaping must be assumed broken — and this
      # one had never been exercised, since every ID-less PR in this repo
      # predates enforcement.
      #
      # The rule now lives in .github/scripts/pr-title-rule.mjs, which the
      # step below runs and the red-case fixture imports. Same code, both
      # paths. Splitting the check across two steps costs nothing because the
      # pattern is anchored at the END of the title, so it never needed the
      # action to strip the `type(scope):` prefix for it.
      - uses: amannn/action-semantic-pull-request@v6
        with:
          # Conventional commit types matching CONTRIBUTING.md
          types: |
            feat
            fix
            refactor
            doc
            test
            chore
            style
            perf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # PR_BODY goes through `env:`, never interpolated into the run line.
      # `node script.mjs "${{ github.event.pull_request.body }}"` is the
      # documented script-injection footgun — a body containing
      #   a"; ls $GITHUB_WORKSPACE"
      # would execute. Passing it as an environment variable keeps the value
      # in memory and out of shell script generation:
      # https://docs.github.com/en/actions/reference/security/secure-use
      #
      # In practice the script reads the title and body from
      # GITHUB_EVENT_PATH, so nothing untrusted reaches the shell at all —
      # but the env form is kept as the explicit, reviewable contract.
      #
      # The `edited` trigger above re-runs this when the body changes, so
      # adding [noticket] un-blocks a PR without a new push.
      - name: Validate ticket ID (honours the [noticket] escape hatch)
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node .github/scripts/pr-title-rule.mjs

  # Permanent red case for the pattern above (KB-116), modelled on
  # lint-settings.yaml. CONTRIBUTING.md "Enforcement Mechanisms" requires a
  # mechanism to be demonstrated rejecting bad input, and re-demonstrated
  # after every edit — running the fixture on every PR makes that continuous
  # instead of a one-off screenshot at introduction.
  check-pattern-red-case:
    name: Red case — PR-title pattern rejects bad subjects
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run fixture table against the rule
        run: node .github/scripts/check-pr-title-pattern.mjs
