name: Lint settings spec

# Deterministic schema validation of the repo-settings specs (KB-82).
# The REQUIRED org norms (squash_title: pr_title, squash_message:
# commit_messages) are pinned as `const` in the schema, so a spec that
# launders a live footgun into the file fails CI — no LLM judgment
# involved.
#
# The fixture steps are a permanent red case (KB-84 principle: no
# enforcement mechanism without a demonstrated red case). Every file under
# schemas/fixtures/invalid/ MUST be rejected and every file under
# schemas/fixtures/valid/ MUST be accepted, on every run — so the mechanism
# re-proves continuously that it still discriminates.
#
# Both directions matter (KB-117). A schema that rejects everything would
# pass a red-case check that only tested bad input, while rejecting specs
# that are perfectly legitimate — which is what this schema did to
# anyone.work, demanding squash norms from a merge-only repo and refusing
# branch protection stricter than the norm.

on:
  pull_request:
    paths:
      - '.github-settings.yaml'
      - 'templates/github-settings.yaml'
      - 'schemas/github-settings.schema.json'
      - 'schemas/fixtures/**'
      - '.github/workflows/lint-settings.yaml'
  push:
    branches: [main]
    paths:
      - '.github-settings.yaml'
      - 'templates/github-settings.yaml'
      - 'schemas/github-settings.schema.json'
      - 'schemas/fixtures/**'
      - '.github/workflows/lint-settings.yaml'

permissions:
  contents: read

jobs:
  validate-settings:
    name: Validate settings specs against schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Validate every spec this repo actually has. The KB carries two -- its own
      # .github-settings.yaml and the downstream-facing template -- while a repo
      # adopting this bundle carries only the first. Tolerating the absent one
      # keeps a SINGLE workflow file correct in both places, which is what lets
      # the bundle stay byte-identical to the KB's copy and be drift-checked
      # (KB-117). At least one spec must exist, so this cannot pass vacuously.
      - name: Validate real specs (must pass)
        run: |
          present=()
          for spec in .github-settings.yaml templates/github-settings.yaml; do
            [ -f "$spec" ] && present+=("$spec")
          done
          if [ ${#present[@]} -eq 0 ]; then
            echo "::error::No settings spec found — expected .github-settings.yaml at the repo root"
            exit 1
          fi
          echo "Validating: ${present[*]}"
          pipx run check-jsonschema \
            --schemafile schemas/github-settings.schema.json \
            "${present[@]}"

      - name: Green case — every valid fixture must be accepted
        run: |
          shopt -s nullglob
          files=(schemas/fixtures/valid/*.yaml)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No valid fixtures — the schema is untested against legitimate specs"
            exit 1
          fi
          rc=0
          for f in "${files[@]}"; do
            if pipx run check-jsonschema \
                 --schemafile schemas/github-settings.schema.json "$f"; then
              echo "  ok   $f accepted"
            else
              echo "::error file=$f::Validator REJECTED a legitimate spec — the schema is too strict"
              rc=1
            fi
          done
          exit $rc

      - name: Red case — every invalid fixture must be rejected
        run: |
          shopt -s nullglob
          files=(schemas/fixtures/invalid/*.yaml)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No invalid fixtures — this cannot demonstrate a red case"
            exit 1
          fi
          rc=0
          for f in "${files[@]}"; do
            if pipx run check-jsonschema \
                 --schemafile schemas/github-settings.schema.json "$f" 2>/dev/null; then
              echo "::error file=$f::Validator ACCEPTED a spec violating REQUIRED norms — enforcement is broken"
              rc=1
            else
              echo "  ok   $f rejected"
            fi
          done
          exit $rc
